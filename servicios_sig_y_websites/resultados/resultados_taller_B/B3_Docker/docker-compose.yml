services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis_boyaca
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geodatos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: